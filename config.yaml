models:
  high_tier: "gpt-4o"
  mid_tier: "claude-3-5-sonnet-20240620"
  low_tier: "groq/llama3-8b-8192"
  embedding: "text-embedding-3-small"

caching:
  enabled: true
  similarity_threshold: 0.95 # Cosine similarity required for a cache hit
  ttl_seconds: 86400 # 24 hours
  embedding_dimension: 1536

routing_rules:
  # Evaluated in order. First match wins.
  - name: "complex_task_keyword"
    condition: "contains_keyword"
    keywords:
      - "synthesize"
      - "analyze"
      - "critique"
      - "evaluate"
      - "prove"
      - "reason"
      - "architect"
    target_tier: "high_tier"
  - name: "long_context"
    condition: "max_tokens_exceeded"
    threshold: 1000
    target_tier: "mid_tier"
  - name: "default"
    condition: "catch_all"
    target_tier: "low_tier"

fallbacks:
  - primary: "gpt-4o"
    backup: "claude-3-5-sonnet-20240620"
  - primary: "claude-3-5-sonnet-20240620"
    backup: "groq/llama3-8b-8192"
  - primary: "groq/llama3-8b-8192"
    backup: "gpt-4o"
